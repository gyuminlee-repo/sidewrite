<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Sidewrite figures</title>
    <link rel="stylesheet" href="/figures/figures.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-title">
        <h1>Figure changes</h1>
        <p class="sub">
          Sidewrite. Record a revised or new figure under the reviewer comment it answers.
        </p>
      </div>
      <div class="top-pick">
        <label for="manuscript">Manuscript</label>
        <select id="manuscript"></select>
        <button id="reload" type="button">Reload</button>
      </div>
    </header>
    <main>
      <div id="notice" class="notice" hidden></div>
      <div id="empty" class="empty" hidden>
        <h2>No manuscript is open</h2>
        <p>Open the manuscript in Word with the Sidewrite pane, then reload.</p>
      </div>
      <div id="comments"></div>
    </main>
    <script src="/figures/figures.js"></script>
  </body>
</html>
